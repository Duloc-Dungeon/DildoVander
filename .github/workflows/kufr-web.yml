name: Check Kufr mobile web

on:
  workflow_call:
    inputs:
      reuse-validation:
        description: Internal verified same-tree PR test reuse; default runs every test
        type: boolean
        default: false
      share-web-dist:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  web:
    # Only canonical main builds may use the isolated ARM64 pool; candidates stay hosted.
    runs-on: ${{ fromJSON(vars.ARM64_BUILD_RUNNERS == 'true' && github.repository == 'Duloc-Dungeon/DildoVander' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !fromJSON(toJSON(github.event)).inputs.pr_number && !fromJSON(toJSON(github.event)).inputs.expected_head_sha && !fromJSON(toJSON(github.event)).inputs.expected_base_sha && '["self-hosted","Linux","ARM64","build-arm64"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 10
    env:
      NPM_CONFIG_FETCH_TIMEOUT: '30000'
    defaults:
      run:
        working-directory: mobilni-aplikace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mobilni-aplikace/.nvmrc
          cache: npm
          cache-dependency-path: |
            mobilni-aplikace/package-lock.json
            contracts/package-lock.json
            firmware/simulator/package-lock.json
      - run: npm ci
      - run: npm ci --prefix ../contracts
      - run: npm test --prefix ../contracts
        if: inputs.reuse-validation != true || github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/main'
      - run: npm test
        if: inputs.reuse-validation != true || github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/main'
      - run: npm run build
      - name: Share compiled application with site checks
        if: inputs.share-web-dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shared-web-dist
          path: mobilni-aplikace/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - run: bash -n scripts/build-ios-ipa.sh
      - run: python3 -m unittest discover -s scripts -p 'test_publish_*.py'
        if: inputs.reuse-validation != true || github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/main'
      - name: Test app-only iOS signing settings and source restoration
        if: inputs.reuse-validation != true || github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/main'
        run: python3 -m unittest discover -s scripts -p 'test_configure_ios_signing.py'
      - name: Package web build with provenance
        working-directory: .
        run: python3 scripts/ci/package.py pack mobilni-aplikace/dist "$RUNNER_TEMP/web-package"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # PR CI validates packages; explicit main builds retain deployable artifacts.
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !github.event.inputs.pr_number
        with:
          name: web-dist
          path: ${{ runner.temp }}/web-package/
          if-no-files-found: error
          retention-days: 1
          overwrite: true
