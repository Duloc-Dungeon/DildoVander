<!doctype html>
<html lang="cs">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opona · testovací náhled</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #080909; color: #efe9df; }
  body { margin: 0; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  .controls { position: fixed; z-index: 1; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 16px; max-width: calc(100% - 64px); padding: 12px 16px; background: #17151df2; border: 1px solid #766778; border-radius: 12px; }
  button { flex-shrink: 0; padding: 12px 18px; border: 0; border-radius: 7px; background: #e5c195; color: #201a19; font: inherit; font-weight: 650; cursor: pointer; }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  p { margin: 0; font-size: 13px; }
  @media (max-width: 600px) { .controls { gap: 8px; flex-direction: column; width: max-content; text-align: center; } }
</style>
<iframe title="Skutečná čekárna s oponou"></iframe>
<div class="controls">
  <button type="button">Přehrát oponu</button>
  <p role="status">Testovací postava · animace začne až po kliknutí.</p>
</div>
<script type="module">
  const frame = document.querySelector('iframe');
  const button = document.querySelector('button');
  const status = document.querySelector('[role="status"]');
  let observer;
  let timeout;
  frame.addEventListener('load', () => {
    observer?.disconnect();
    clearTimeout(timeout);
    const document = frame.contentDocument;
    let positioned = false;
    let openingSeen = false;
    function observeReplay() {
      const curtain = document.querySelector('.viewport-curtain');
      if (curtain) openingSeen = true;
      if (openingSeen && !curtain) {
        status.textContent = 'Opona se přehrála. Tlačítkem ji spustíš znovu.';
        observer.disconnect();
        clearTimeout(timeout);
      }
      const portrait = document.querySelector('.portrait-stage');
      if (!portrait || positioned) return;
      positioned = true;
      portrait.scrollIntoView({ block: 'center', behavior: 'instant' });
    }
    observer = new MutationObserver(observeReplay);
    observer.observe(document, { childList: true, subtree: true });
    timeout = setTimeout(() => observer.disconnect(), 10_000);
    observeReplay();
  });
  button.addEventListener('click', () => {
    // This server owns only fictional fixture data. Production storage is untouched.
    for (const key of Object.keys(localStorage)) {
      if (key.startsWith('wand.portrait-seen.v1.')) localStorage.removeItem(key);
    }
    status.textContent = 'Spouštím skutečnou oponu čekárny…';
    frame.src = '/launch';
  });
</script>
</html>
