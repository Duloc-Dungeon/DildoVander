name: Verify ARM64 build runners

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'Duloc-Dungeon/DildoVander' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2]
    runs-on: [self-hosted, Linux, ARM64, build-arm64, 'build-arm64-${{ matrix.runner }}']
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: contracts/.nvmrc
      - name: Verify unprivileged ARM64 execution and offline evaluations
        run: |
          test "$(uname -m)" = aarch64
          test "$(id -u)" != 0
          test ! -r /run/docker.sock
          test ! -r /root/.ssh/id_ed25519
          node --version
          python3 -m unittest discover -s ai-eval -p 'test_*.py'
