name: Development CI

on:
  pull_request:
    branches: [development]
    types: [opened, reopened, synchronize, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      project:
        description: Compatibility input; affected projects are selected from the PR diff
        type: string
      pr_number:
        description: Same-repository development PR number
        required: true
        type: string
      expected_head_sha:
        description: Expected PR head SHA
        required: true
        type: string
      expected_base_sha:
        description: Expected development SHA
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  # A title/body edit must never cancel an in-flight source validation.
  # Metadata runs still execute the same fail-closed checks; no green shortcut.
  group: development-ci-${{ github.event.action == 'edited' && !github.event.changes.base && format('metadata-{0}', github.run_id) || github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    name: Verify development candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify dispatched PR identity before accepting checks
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_HEAD: ${{ inputs.expected_head_sha }}
          PR_BASE: ${{ inputs.expected_base_sha }}
        with:
          script: |
            const { verifyDevelopmentCandidate } = require('./scripts/ci/branch-policy.cjs');
            await verifyDevelopmentCandidate({ github, context }, process.env);

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install verified Gitleaks
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Verify secret detection and false-positive regressions
        run: GITLEAKS_BINARY="$RUNNER_TEMP/gitleaks" python3 -m unittest discover -s scripts/ci -p 'test_secret_scan.py'
      - name: Scan checkout history without logging secret values
        # HEAD includes the PR merge and its ancestors, including removed secrets.
        # Other fetched branches/tags are independent of this checkout.
        run: '"$RUNNER_TEMP/gitleaks" git --config=.gitleaks.toml --redact=100 --no-banner --log-opts=HEAD'

  repository:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: contracts/.nvmrc
      - name: Install pinned workflow validator
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
      - name: Validate all workflows
        run: |
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=
      - name: Test artifact provenance and promotion guards
        run: node --test scripts/ci/*.test.cjs
      - name: Test artifact integrity and safe extraction
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD
      - name: Verify Vapour Chrome design integrity
        run: |
          python3 scripts/generate_design_tokens.py --check
          npm test --prefix design-system
          python3 -m unittest discover -s scripts -p 'test_design_system.py'
          python3 scripts/check_design_system.py

  changes:
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      backend: ${{ steps.projects.outputs.backend }}
      firmware: ${{ steps.projects.outputs.firmware }}
      web: ${{ steps.projects.outputs.web }}
      ios: ${{ steps.projects.outputs.ios }}
      android: ${{ steps.projects.outputs.android }}
      ai-eval: ${{ steps.projects.outputs.ai-eval }}
      site: ${{ steps.projects.outputs.site }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select affected product checks
        id: projects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.expected_base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.expected_head_sha }}
        run: python3 scripts/ci/select_projects.py select --base "$BASE_SHA" --head "$HEAD_SHA"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/kufr-backend.yml

  firmware:
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    uses: ./.github/workflows/kufr-firmware.yml

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/kufr-web.yml
    with:
      share-web-dist: ${{ needs.changes.outputs.site == 'true' }}

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    uses: ./.github/workflows/kufr-ios.yml

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    uses: ./.github/workflows/kufr-android.yml

  ai-eval:
    needs: changes
    if: needs.changes.outputs.ai-eval == 'true'
    uses: ./.github/workflows/kufr-ai-eval.yml

  site:
    needs: [changes, web]
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.site == 'true' && ((needs.changes.outputs.web == 'true' && needs.web.result == 'success') || (needs.changes.outputs.web == 'false' && needs.web.result == 'skipped'))
    uses: ./.github/workflows/kufr-site.yml
    with:
      reuse-web-dist: ${{ needs.changes.outputs.web == 'true' }}

  required:
    name: Development required
    if: always()
    needs: [candidate, secret-scan, repository, changes, backend, firmware, web, ios, android, ai-eval, site]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      RESULTS: ${{ toJSON(needs) }}
      SELECTED: ${{ toJSON(needs.changes.outputs) }}
    steps:
      - name: Require repository checks and every selected product check
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          selected = json.loads(os.environ['SELECTED'])
          required = {'candidate', 'secret-scan', 'repository', 'changes'}
          products = {'backend', 'firmware', 'web', 'ios', 'android', 'ai-eval', 'site'}
          if set(selected) != products or any(value not in ('true', 'false') for value in selected.values()):
              raise SystemExit('Missing or invalid product selection')
          if set(results) != required | products:
              raise SystemExit('Missing required job result')
          failed = [name for name, job in results.items()
                    if job['result'] != ('success' if name in required or selected.get(name) == 'true' else 'skipped')]
          if failed:
              raise SystemExit('Development checks did not pass: ' + ', '.join(failed))
          PY
