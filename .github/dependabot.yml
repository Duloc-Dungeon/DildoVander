version: 2
updates:
  - package-ecosystem: github-actions
    target-branch: development
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
    open-pull-requests-limit: 3
  - package-ecosystem: nuget
    target-branch: development
    directories:
      - /backend
      - /backend-tests
    schedule:
      interval: weekly
    groups:
      backend:
        patterns: ['*']
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    target-branch: development
    directories:
      - /mobilni-aplikace
      - /contracts
      - /firmware/simulator
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']
    open-pull-requests-limit: 3
