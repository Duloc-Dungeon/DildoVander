name: Build DildoVander application

on:
  workflow_call:
    inputs:
      reuse-validation:
        description: Internal verified same-tree PR test reuse; default runs every test
        type: boolean
        default: false
      reuse-web-dist:
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      artifact_id: ${{ steps.package.outputs.artifact-id }}
    timeout-minutes: 20
    env:
      NPM_CONFIG_FETCH_TIMEOUT: '30000'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Allocate isolated application staging
        run: |
          site_work=$(mktemp -d "$RUNNER_TEMP/dildovander-app.XXXXXX")
          echo "SITE_WORK=$site_work" >> "$GITHUB_ENV"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: mobilni-aplikace/.nvmrc
          cache: npm
          cache-dependency-path: |
            mobilni-aplikace/package-lock.json
            contracts/package-lock.json
      - name: Guard application and viewer CI independence
        run: python scripts/ci/ui_boundary.py
      - name: Validate application packaging fixtures
        if: inputs.reuse-validation != true || github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/main'
        run: |
          python scripts/generate_design_tokens.py --check
          npm test --prefix design-system
          python -m unittest discover -s web -p 'test_*.py'
          for test in test_application_routes.py test_character_admin_proxy.py test_distribution_store.py test_keepsake_proxy.py test_launch_resource_gate.py test_private_pipeline_preparation.py test_release_store.py; do
            python -m unittest discover -s web/deploy -p "$test"
          done
      - name: Install shared application browser dependencies
        working-directory: mobilni-aplikace
        run: |
          npm ci
          npm ci --prefix ../contracts
      - name: Reuse compiled application from web checks
        if: inputs.reuse-web-dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shared-web-dist
          path: mobilni-aplikace/dist/
      - name: Build shared application at its canonical root
        if: '!inputs.reuse-web-dist'
        working-directory: mobilni-aplikace
        run: |
          npm test --prefix ../contracts
          npm test
          npm run build
      - name: Verify shared application browser journeys
        if: inputs.reuse-validation != true || github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/main'
        working-directory: mobilni-aplikace
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
          npm run test:launch:browser
          npm run test:owner:browser
          npm run test:persona-lab:browser
          npm run test:updates:browser
          node scripts/archive-show.browser.mjs
          node tests/personal-wand-duel.browser.mjs
      - name: Check real compiled application inputs without CAD
        env:
          KUFR_SITE_WEB_DIST: ${{ github.workspace }}/mobilni-aplikace/dist
        run: python -m unittest discover -s web -p test_site_inputs.py
      - name: Assemble application
        run: python web/build-site.py --destination "$SITE_WORK/source" --web-dist mobilni-aplikace/dist
      - name: Package with source provenance
        run: python scripts/ci/package.py pack "$SITE_WORK/source" "$SITE_WORK/package"
      - name: Upload immutable main package
        id: package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # PR checks package locally; only explicit main builds retain a deployable artifact.
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && !github.event.inputs.pr_number
        with:
          name: arcane-site
          path: ${{ env.SITE_WORK }}/package/
          if-no-files-found: error
          retention-days: 1
      - name: Remove hosted application staging
        if: always() && env.SITE_WORK != ''
        run: |
          case "$SITE_WORK" in
            "$RUNNER_TEMP"/dildovander-app.*) rm -rf -- "$SITE_WORK" ;;
            *) echo 'Refusing unexpected staging path' >&2; exit 1 ;;
          esac
